<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
    font-family: 'Arial', sans-serif;
    color: #333;
}

.navbar {
    background-color: #663399;
}

#about, #gallery, #booking {
    background-color: #ffcccc;
}

@media (max-width: 768px) {
    .navbar-brand {
        font-size: 1.5rem;
    }
    .navbar-nav {
        flex-direction: column;
        align-items: center;
    }
}
</style>

    <title>Котостудия</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Котостудия</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#about">О нас</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#gallery">Галерея</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#booking">Запись на съёмку</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section id="about" class="py-5">
        <div class="container text-center">
            <h1>Мы фотографируем котиков</h1>
            <p>Добро пожаловать в «Котостудию» — пространство, где пушистики становятся моделями!</p>
        </div>
    </section>

    <section id="gallery" class="py-5">
        <div class="container text-center">
            <h2>Галерея</h2>
            <div class="row g-4">
                <div class="col-md-4">
                    <img src="cat1.jpg" class="w-100 rounded" alt="Котёнок 1">
                </div>
                <div class="col-md-4">
                    <img src="cat2.jpg" class="w-100 rounded" alt="Котёнок 2">
                </div>
                <div class="col-md-4">
                    <img src="cat3.jpg" class="w-100 rounded" alt="Котёнок 3">
                </div>
            </div>
        </div>
    </section>

    <section id="booking" class="py-5">
        <div class="container text-center">
            <h2>Записаться на фотосессию</h2>
            <form id="bookingForm" class="w-50 mx-auto">
                <div class="mb-3">
                    <label for="name" class="form-label">Имя</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="catName" class="form-label">Имя котика</label>
                    <input type="text" class="form-control" id="catName" required>
                </div>
                <button type="submit" class="btn btn-primary">Отправить</button>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
